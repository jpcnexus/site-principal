
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nexus JPC — Soluções digitais, tecnologia e inovação.">
  <title>Nexus JPC | Tecnologia e Soluções Digitais</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0c1020;
      color: #f5f5ff;
    }
    header {
      padding: 24px 8%;
      border-bottom: 1px solid #30344c;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #a78bfa;
    }
    main {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 8%;
      text-align: center;
    }
    .content { max-width: 750px; }
    h1 {
      font-size: clamp(36px, 7vw, 64px);
      margin-bottom: 20px;
    }
    h1 span { color: #a78bfa; }
    p {
      color: #b7bdd1;
      font-size: 18px;
      line-height: 1.7;
    }
    .status {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #7557c8;
      border-radius: 30px;
      color: #c4b5fd;
      font-size: 14px;
    }
    footer {
      padding: 24px;
      text-align: center;
      color: #9299b2;
      border-top: 1px solid #30344c;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">NEXUS JPC</div>
  </header>
  <main>
    <div class="content">
      <div class="status">Em construção</div>
      <h1>Ideias conectadas.<br><span>Soluções digitais.</span></h1>
      <p>
        Estamos construindo experiências digitais,
        produtos e soluções que conectam tecnologia,
        criatividade e oportunidades.
      </p>
      <p>Em breve, nosso novo site estará disponível.</p>
    </div>
  </main>
  <footer>© 2026 Nexus JPC. Todos os direitos reservados.</footer>
</body>
</html>
